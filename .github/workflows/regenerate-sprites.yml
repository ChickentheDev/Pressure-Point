name: Regenerate smooth sprite sheets

on:
  push:
    branches:
      - art/smooth-bold-sprite-pass
    paths:
      - tools/gen_sprites.py
      - .github/workflows/regenerate-sprites.yml

permissions:
  contents: write

jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/smooth-bold-sprite-pass
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Regenerate sprite sheets
        run: python tools/gen_sprites.py
      - name: Commit generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate smooth high-resolution sprite sheets"
            git push
          fi
